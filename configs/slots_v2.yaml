slots:
  input:
  - id: quote_exact_units
    text: When the source document states a value with a unit or symbol ($, %, kg,
      m, "days"), copy that unit or symbol exactly as written rather than paraphrasing,
      rounding, or converting it.
  - id: prefer_nearest_sentence
    text: Answers are usually contained in a single sentence of the source document.
      Locate the sentence whose subject matches the question's subject, and if several
      numbers appear nearby, prefer the one in that exact sentence over ones in neighboring
      sentences.
  output:
  - id: answer_only
    text: State only the final answer, with no surrounding explanation, caveats, or
      restatement of the question.
